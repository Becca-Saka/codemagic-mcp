[project]
name = "codemagic-mcp"
version = "0.0.1"
description = "Codemagic MCP server — expose Codemagic capabilities as MCP tools/prompts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
codemagic-mcp = "codemagic_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codemagic_mcp"]
